<style>
:root{color-scheme:light;--bg:#d6ebfa;--card:#fff;--ink:#1f2a24;--mut:#5d6b75;--line:#bcd8ec;--acc:#2f7d4f;--acc2:#e8f3ec;--warn:#b4531a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:76px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{padding:16px 16px 4px}
h1{margin:0;font-size:19px;display:flex;align-items:center;gap:10px}
.logo{height:44px;width:auto;flex:none}
.sub{color:var(--mut);font-size:13px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px;border-bottom:1px solid var(--line)}
label.f{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
select,input[type=date]{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;min-height:44px}
main{padding:14px 16px;max-width:760px;margin:0 auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px}
.card .k{font-size:12px;color:var(--mut)}
.card .v{font-size:22px;font-weight:700;margin-top:2px;word-break:break-word}
.card .h{font-size:11.5px;color:var(--mut);margin-top:4px}
.card.in{padding-bottom:11px}
.card.in input{margin-top:6px}
.acc{background:var(--acc2);border-color:transparent}
.acc .v{color:var(--acc)}
.warn{color:var(--warn)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--acc2);color:var(--acc);margin-left:6px;vertical-align:middle}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:460px}
th,td{padding:8px 10px;text-align:left;border:1px solid #9fbfd6;white-space:nowrap}
th{font-size:12px;color:#25405a;font-weight:700;background:#e3eff8}
td.n,th.n{text-align:right}
tfoot td{font-weight:700;background:#f1f7fc}
.empty{padding:28px 12px;text-align:center;color:var(--mut)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:9px 4px 8px;font:inherit;font-size:12px;min-height:52px}
nav button b{display:block;font-size:19px;line-height:1.1}
nav button.on{color:var(--acc);font-weight:700}
.sec{display:none}.sec.on{display:block}
.inrow td{background:var(--acc2)}
tr.man td{background:#eaf4fc}
input.cell,select.cell{width:100%;min-width:92px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font:inherit;font-size:13px;min-height:40px}
button.add{border:0;background:var(--acc);color:#fff;border-radius:8px;padding:9px 12px;font:inherit;font-size:13px;font-weight:600;min-height:40px}
button.add.wide{width:100%;margin-top:12px}
button.delb,button.delm,button.del{border:0;background:none;color:var(--warn);font-size:16px;padding:6px 8px;min-height:36px}
p.note.warn{min-height:0}
.stat{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mut);margin-top:2px}
.stat .ok{color:var(--acc)}
.stat button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:3px 10px;font:inherit;font-size:12px;min-height:28px}
#login{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
#login[hidden]{display:none}
.lbox{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.lbox h2{margin:0 0 2px}
.lbox input{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;min-height:44px;background:#fff;color:var(--ink)}
.bt{font-weight:700;margin:2px 2px 10px}
table.bh td.hd{background:#e3eff8;font-weight:700;color:#25405a}
table.bh td.n{text-align:right}
table.bh{min-width:0}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
button.dela,button.delt,button.delp{border:0;background:none;color:var(--warn);font-size:16px;padding:6px 8px;min-height:36px}
.btnrow button:first-child{grid-column:1/-1}
#rpv,#slv{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 24px}
#rpv[hidden],#slv[hidden]{display:none}
.rpbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:640px;margin:0 auto}
.rpbar button:first-child{grid-column:1/-1}
.paper{background:#fff;color:#111;border:1px solid var(--line);border-radius:10px;padding:20px 18px;max-width:640px;margin:8px auto}
.rph{border-bottom:2px solid #9fbfd6;padding-bottom:12px;margin-bottom:26px}
.rpt{font-size:19px;font-weight:800}.rps{font-weight:700;margin-top:4px}.rpd{font-size:12px;color:#667;margin-top:2px}
.rpi{margin-bottom:34px}.rpl{font-weight:700;font-size:14px}.rpv{font-weight:800;font-size:21px;margin:4px 0 2px 14px}.rpn{font-size:12px;color:#667;font-style:italic;margin-left:14px}
.slh{display:flex;align-items:center;gap:12px}.slh img{width:64px;height:64px;flex:none}.slh b{font-size:16px}
.slj{text-align:center;font-weight:800;font-size:16px;margin:10px 0 4px;padding-bottom:6px;border-bottom:2px solid #333}
.slr{display:flex;justify-content:space-between;margin-top:8px;font-size:13px}
table.slt{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px;min-width:0}
table.slt td{border:1px solid #333;padding:7px 10px;white-space:normal}table.slt td.n{text-align:right;white-space:nowrap}
table.slt tr.sb td{background:#eee;font-weight:700}
.slg{height:28px}.slb{margin-top:16px;font-size:13px}
.slsg{display:flex;justify-content:space-between;margin-top:40px;font-size:13px}
.slnm{margin-top:46px;font-weight:700}.slc{text-align:center;display:flex;flex-direction:column;align-items:center}
.slc img{width:170px;max-width:100%;margin:4px 0}
p.note{font-size:12px;color:var(--mut);margin:12px 2px 0}
</style>

function localSet(k,o){try{localStorage.setItem(ST+k,JSON.stringify(o))}catch(e){}}
function fixLocalIds(){try{for(let i=0;i<localStorage.length;i++){const n=localStorage.key(i);if(!n||n.indexOf(ST)!==0||n.indexOf('mig:')>=0)continue;const o=JSON.parse(localStorage.getItem(n)||'{}');if(AF.some(f=>(o[f]||[]).some(x=>!x.id)))localStorage.setItem(n,JSON.stringify(norm(o)))}}catch(e){}}
function setStatus(t,ok){const e=$('#st');if(e){e.textContent=t;e.className=ok?'ok':''}}
function load(){const k=key();return mem[k]||localGet(k)}
function pushDiff(k,b,a){
  const{db,fs}=CLOUD,ref=fs.doc(db,'kandang',k),up={};
  if(b.masuk!==a.masuk||b.habis!==a.habis){up.masuk=a.masuk||'';up.habis=a.habis||''}
  if(b.pop!==a.pop)up.pop=a.pop||0;
  if(b.pakan!==a.pakan)up.pakan=a.pakan||0;
  if(b.pbr!==a.pbr)up.pbr=a.pbr||0;
  const ids=s=>new Set(s.map(x=>x.id));
  AF.forEach(f=>{
    const bi=ids(b[f]),ai=ids(a[f]);
    const add=a[f].filter(x=>!bi.has(x.id)),del=b[f].filter(x=>!ai.has(x.id));
    if(add.length)fs.setDoc(ref,{[f]:fs.arrayUnion(...add)},{merge:true}).catch(()=>setStatus('Gagal sinkron'));
    if(del.length)fs.setDoc(ref,{[f]:fs.arrayRemove(...del)},{merge:true}).catch(()=>setStatus('Gagal sinkron'));
  });
  if(Object.keys(up).length)fs.setDoc(ref,up,{merge:true}).catch(()=>setStatus('Gagal sinkron'));
}
function change(fn){
  const k=key(),before=JSON.parse(JSON.stringify(load())),after=JSON.parse(JSON.stringify(before));
  fn(after);mem[k]=after;localSet(k,after);
  if(CLOUD&&CLOUD.user)pushDiff(k,before,after);
}
function softRender(){const a=document.activeElement;if(a&&a.tagName==='INPUT'){pending=true;return}render()}
document.addEventListener('focusout',()=>{if(pending){pending=false;setTimeout(render,80)}});
function migrated(k){try{return localStorage.getItem(ST+'mig:'+k)==='1'}catch(e){return false}}
function pushLocal(k,cloud){
  const{db,fs}=CLOUD,loc=localGet(k),up={};
  AF.forEach(f=>{const add=loc[f].filter(x=>!cloud[f].some(y=>y.id===x.id));if(add.length)up[f]=fs.arrayUnion(...add)});
  ['masuk','habis','pop','pakan','pbr'].forEach(f=>{if(!cloud[f]&&loc[f])up[f]=loc[f]});
  if(Object.keys(up).length)fs.setDoc(fs.doc(db,'kandang',k),up,{merge:true}).catch(()=>setStatus('Gagal sinkron'));
  try{localStorage.setItem(ST+'mig:'+k,'1')}catch(e){}
}
function subscribe(){
  if(!CLOUD||!CLOUD.user||unsub)return;
  const{db,fs}=CLOUD;
  unsub=fs.onSnapshot(fs.collection(db,'kandang'),{includeMetadataChanges:true},snap=>{
    const seen=new Set(),off=snap.metadata.fromCache,pend=snap.metadata.hasPendingWrites;
    snap.forEach(d=>{
      const k=d.id,cloud=norm(d.data());seen.add(k);
      if(!off&&!pend&&!migrated(k))pushLocal(k,cloud);
      mem[k]=cloud;localSet(k,cloud);
    });
    if(!off&&!pend){
      try{for(let i=0;i<localStorage.length;i++){const n=localStorage.key(i);if(n&&n.indexOf(ST)===0&&n.indexOf('mig:')<0){const k=n.slice(ST.length);if(!seen.has(k)&&/^[12]-\d+$/.test(k)&&!migrated(k))pushLocal(k,norm({}))}}}catch(e){}
    }
    setStatus(off?'Offline, data tersimpan di HP':'Tersinkron',!off);
    softRender();
  },e=>setStatus(e&&e.code==='permission-denied'?'Akses ditolak, cek Rules Firestore':'Tidak tersambung'+(e&&e.code?' ('+e.code+')':'')));
}
async function initCloud(){
  try{
    const[A,Au,F]=await Promise.all([import(SDK+'firebase-app.js'),import(SDK+'firebase-auth.js'),import(SDK+'firebase-firestore.js')]);
    const app=A.initializeApp(FB),auth=Au.getAuth(app);
    const db=F.initializeFirestore(app,{localCache:F.persistentLocalCache(),experimentalAutoDetectLongPolling:true});
    CLOUD={app,auth,db,fs:F,au:Au,user:null};
    Au.onAuthStateChanged(auth,u=>{
      CLOUD.user=u;$('#out').hidden=!u;
      if(u){$('#login').hidden=true;setStatus('Menyambung…');subscribe();render()}
      else{if(unsub){unsub();unsub=null}$('#login').hidden=false;setStatus('Belum masuk')}
    });
  }catch(e){setStatus('Mode offline: data hanya di HP ini')}
}

const SALDO_AWAL=29446636;
function allDocs(){
  const keys=new Set(Object.keys(mem));
  try{for(let i=0;i<localStorage.length;i++){const n=localStorage.key(i);if(n&&n.indexOf(ST)===0&&n.indexOf('mig:')<0)keys.add(n.slice(ST.length))}}catch(e){}
  return[...keys].filter(k=>/^[12]-\d+$/.test(k)).map(k=>mem[k]||localGet(k));
}
function saldoFrom(docs){
  let v=SALDO_AWAL,n=0;
  docs.forEach(m=>{v+=sum(m.trm,x=>x.j)-sum(m.byr,x=>x.j)-sum(m.amb,x=>x.a1+x.a2+x.a3)-sum(m.lap,x=>x.k)+sum(m.lap,x=>x.d);n+=m.trm.length+m.byr.length+m.amb.length+m.lap.length});
  return{v,adj:n>0};
}
function saldoNow(){return saldoFrom(allDocs())}
const SALDO_KET='Satu saldo, sama di semua kandang, tab, dan periode';
function umurDays(t,masuk){
  if(!/^\d{4}-\d\d-\d\d$/.test(t||'')||!masuk)return null;
  const d=Math.round((new Date(t+'T00:00:00')-new Date(masuk+'T00:00:00'))/864e5);
  return d<0?null:d;
}
function fillP(){
  const ps=periods(K);if(!P||!ps.includes(P))P=latest(K);
  $('#selP').innerHTML=ps.map(p=>`<option value="${p}"${p===P?' selected':''}>Periode ${p}${hasData(K,p)?'':' (kosong)'}</option>`).join('');
}
function umurInfo(m,h){
  if(!m)return{v:'—',h:'Isi tanggal masuk ayam'};
  const a=new Date(m+'T00:00:00'),t=new Date();
  const end=h?new Date(h+'T00:00:00'):new Date(t.getFullYear(),t.getMonth(),t.getDate());
  const d=Math.round((end-a)/864e5);
  if(d<0)return{v:'—',h:'Tanggal habis panen lebih awal dari tanggal masuk',w:1};
  return{v:d+' hari',h:h?'Dihitung sampai tanggal habis panen ('+tgl(h)+')':'Tanggal habis panen belum diisi, dihitung sampai hari ini'};
}
function panenTot(){
  const r=D.rek[key()],m=load(),p=m.pan,pm=sum(m.mat,x=>x.m);
  const ekor=(r?r.ekor:0)+sum(p,x=>x.e),mati=(r?(r.mati||0):0)+pm;
  const sisa=m.pop>0?m.pop-mati-ekor:(r?r.sisa-sum(p,x=>x.e)-pm:null);
  const berat=(r?r.berat:0)+sum(p,x=>x.b);
  const bt=m.pbr*Math.max(0,sisa||0)+berat;
  const fcr=m.pakan>0&&bt>0?m.pakan*50/bt:null;
  return{ekor,berat,mati,matiMan:pm,sisa,any:!!r||p.length>0,man:p.length>0,pakan:m.pakan,pbr:m.pbr,bt,fcr};
}
function lastPanen(){
  const r=D.rek[key()],m=load();
  const ds=(r?r.rows.map(x=>x[0]):[]).concat(m.pan.map(x=>x.t)).filter(x=>/^\d{4}-\d\d-\d\d$/.test(x||'')).sort();
  return ds.length?ds[ds.length-1]:'';
}
function calc(){
  const b=D.bh[key()],m=load(),l=D.lap[key()];
  const exR=b&&b.pendapatan?b.pendapatan:0,manual=m.pdp.length>0;
  const pend=manual?sum(m.pdp,x=>x.j):exR;
  const op=(l?l.kredit:0)+sum(m.lap,x=>x.k);
  const pajak=0.005*pend,at=pend-pajak;
  const k2=K===2,p1=k2?5:10,p2=k2?15:10;
  const gMin=p1/100*at,gMun=p2/100*at,opTot=op+gMin+gMun,kb=at-opTot;
  const a1=sum(m.amb,x=>x.a1),a2=sum(m.amb,x=>x.a2),a3=sum(m.amb,x=>x.a3);
  return{pend,exR,manual,op,pajak,at,gMin,gMun,p1,p2,n2:k2?'Bg Adi':'Bg Mun',opTot,kb,gAdi:0.4*kb,gYed:0.6*kb,a1,a2,a3};
}
function pajakTotal(){
  let v=0,n=0;const cur=key(),c=calc();
  for(const[k,x]of Object.entries(D.bh)){if(k.split('-')[0]==String(K)&&k!==cur&&x.pajak){v+=x.pajak;n++}}
  if(c.pajak>0){v+=c.pajak;n++}
  return{v,n};
}

}

async function saveFile(blob,name,title,forceDl){
  const C=window.Capacitor;
  if(C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.Filesystem&&C.Plugins.Share){
    const u=new Uint8Array(await blob.arrayBuffer());let s='';
    for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));
    const r=await C.Plugins.Filesystem.writeFile({path:name,data:btoa(s),directory:'CACHE'});
    await C.Plugins.Share.share({title:name,url:r.uri,dialogTitle:title||'Bagikan file'});
    return;
  }
  const f=new File([blob],name,{type:blob.type});
  if(!forceDl&&navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),60000);
}
async function backupExcel(){

    const out=X.write(wb,{bookType:'xlsx',type:'array'});
    const blob=new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const d=new Date(),nm='Cadangan-Kandang-PT-PMI-'+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'.xlsx';
    await saveFile(blob,nm,'Simpan cadangan Excel');
    say('Cadangan siap: '+nm+' ('+(sheets[0][1].length-1)+' periode)');
  }catch(e){say('Gagal membuat cadangan: '+(e&&e.message?e.message:'periksa koneksi internet'))}

}

function terbilang(n){
  n=Math.round(n);if(!isFinite(n))return '';
  if(n===0)return 'Nol Rupiah';
  const neg=n<0;n=Math.abs(n);
  const sat=['','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan','sepuluh','sebelas'];
  const t=x=>{
    if(x<12)return sat[x];
    if(x<20)return sat[x-10]+' belas';
    if(x<100)return sat[Math.floor(x/10)]+' puluh'+(x%10?' '+sat[x%10]:'');
    if(x<200)return 'seratus'+(x%100?' '+t(x%100):'');
    if(x<1000)return sat[Math.floor(x/100)]+' ratus'+(x%100?' '+t(x%100):'');
    if(x<2000)return 'seribu'+(x%1000?' '+t(x%1000):'');
    if(x<1e6)return t(Math.floor(x/1000))+' ribu'+(x%1000?' '+t(x%1000):'');
    if(x<1e9)return t(Math.floor(x/1e6))+' juta'+(x%1e6?' '+t(x%1e6):'');
    if(x<1e12)return t(Math.floor(x/1e9))+' miliar'+(x%1e9?' '+t(x%1e9):'');
    return t(Math.floor(x/1e12))+' triliun'+(x%1e12?' '+t(x%1e12):'');
  };
  return (neg?'Minus ':'')+t(n).replace(/(^|\s)\S/g,c=>c.toUpperCase())+' Rupiah';
}
const tw=(s,f,size)=>{let w=0;String(s).split('').forEach(ch=>{const c=ch.charCodeAt(0);w+=(c>=32&&c<=126?HW[f][c-32]:556)});return w*size/1000};
function newPage(W,H){
  const ops=[],esc=s=>String(s).replace(/[^\x20-\x7E]/g,'?').replace(/([\\()])/g,'\\$1');
  const o={ops,
    T(x,y,s,f,size,g){ops.push('BT /'+f+' '+size+' Tf '+(g==null?0.1:g)+' g '+x.toFixed(1)+' '+(H-y).toFixed(1)+' Td ('+esc(s)+') Tj ET')},
    TC(cx,y,s,f,size,g){o.T(cx-tw(s,f,size)/2,y,s,f,size,g)},
    TR(xr,y,s,f,size,g){o.T(xr-tw(s,f,size),y,s,f,size,g)},
    LN(x1,y1,x2,y2,w){ops.push((w||0.8)+' w 0.5 G '+x1+' '+(H-y1)+' m '+x2+' '+(H-y2)+' l S')},
    RC(x,y,w,h,lw){ops.push((lw||0.8)+' w 0.5 G '+x+' '+(H-y-h)+' '+w+' '+h+' re S')},
    FR(x,y,w,h,g){ops.push(g+' g '+x+' '+(H-y-h)+' '+w+' '+h+' re f')},
    IM(n,x,y,w,h){ops.push('q '+w+' 0 0 '+h+' '+x+' '+(H-y-h)+' cm /Im'+n+' Do Q')}
  };
  return o;
}
function pdfAssemble(pages,imgs){
  const W=595,H=842,objs=[],add=s=>{objs.push(s);return objs.length};
  add('<< /Type /Catalog /Pages 2 0 R >>');add('PAGES');
  const f1=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  const f2=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  const f3=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Oblique /Encoding /WinAnsiEncoding >>');
  const ims=imgs.map(im=>{
    const bin=atob(im.b),hx=[];
    for(let i=0;i<bin.length;i++){const c=bin.charCodeAt(i);hx.push((c<16?'0':'')+c.toString(16))}
    const s=hx.join('')+'>';
    return add('<< /Type /XObject /Subtype /Image /Width '+im.w+' /Height '+im.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter [/ASCIIHexDecode /DCTDecode] /Length '+s.length+' >>\nstream\n'+s+'\nendstream');
  });
  const res='<< /Font << /F1 '+f1+' 0 R /F2 '+f2+' 0 R /F3 '+f3+' 0 R >>'+(ims.length?' /XObject << '+ims.map((id,i)=>'/Im'+(i+1)+' '+id+' 0 R').join(' ')+' >>':'')+' >>';
  const kids=[];
  pages.forEach(p=>{
    const body=p.join('\n'),cid=add('<< /Length '+body.length+' >>\nstream\n'+body+'\nendstream');
    kids.push(add('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources '+res+' /Contents '+cid+' 0 R >>'));
  });
  objs[1]='<< /Type /Pages /Kids ['+kids.map(k=>k+' 0 R').join(' ')+'] /Count '+kids.length+' >>';
  let out='%PDF-1.4\n';const off=[];
  objs.forEach((o,i)=>{off.push(out.length);out+=(i+1)+' 0 obj\n'+o+'\nendobj\n'});
  const xr=out.length;
  out+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n'+off.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+'trailer\n<< /Size '+(objs.length+1)+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF';
  const u=new Uint8Array(out.length);for(let i=0;i<out.length;i++)u[i]=out.charCodeAt(i)&255;
  return u;
}

function hitungLaporan(){

    {no:2,label:'JUMLAH PENDAPATAN SETELAH PAJAK (0,5%)',value:fRp(c.at)},

    {no:7,label:'HAK BG MIN = '+c.p1+'% x '+fRp(c.at)+' - Ambilan '+fRp(c.a1),value:fRp(c.gMin-c.a1)},

}
function buildPdf(L){
  const W=595,H=842,M=42,pages=[];let pg=newPage(W,H),y=0;
  const head=first=>{
    if(first){
      pg.IM(1,M,34,60,60);
      pg.T(M+72,60,'PT PERFECTO MITRA INDUSTRI','F2',13);pg.T(M+72,76,'KANDANG AYAM PT.PMI','F1',9,0.35);
      pg.LN(M,104,W-M,104,1.2);
      pg.T(M,132,L.judul,'F2',18);pg.T(M,152,L.sub,'F2',12);pg.T(M,167,L.tanggal,'F1',9,0.4);
      y=190;
    }else y=60;
  };
  head(true);
  if(L.warn){pg.T(M,y,L.warn,'F3',9,0.6);y+=24}
  L.items.forEach(it=>{
    if(y+30>H-60){pages.push(pg.ops);pg=newPage(W,H);head(false)}
    pg.T(M,y,it.no+'. '+it.label,'F2',11);
    pg.T(M+14,y+21,it.value,'F2',16);
    y+=30+34;
  });
  pages.push(pg.ops);
  pages.forEach(p=>p.push('BT /F1 7 Tf 0.5 g '+M+' 28 Td (Laporan dibuat otomatis dari aplikasi KANDANG AYAM PT.PMI) Tj ET'));
  return pdfAssemble(pages,[IMG_LOGO]);
}
function laporanHtml(L){

    (L.warn?`<p class="note warn">${esc(L.warn)}</p>`:'')+
    L.items.map(it=>`<div class="rpi"><div class="rpl">${it.no}. ${esc(it.label)}</div><div class="rpv">${esc(it.value)}</div></div>`).join('');
}
async function kirimPdf(forceDl){

function daftarKaryawan(){return K===2?['Bg Min','Bg Adi','Abang Adi']:['Bg Min','Bg Mun','Abang Adi']}
function hitungSlip(nama){
  const c=calc(),d=new Date(),abang=nama==='Abang Adi',first=nama==='Bg Min';
  const atas=[{l:'PENDAPATAN',v:fRp(c.pend)},{l:'PAJAK (0,5%)',v:fRp(c.pajak)},{l:'PENDAPATAN BERSIH',v:fRp(abang?c.gAdi:c.at),b:1}];
  let boxes,terima;
  if(abang){terima=c.gAdi-c.a3;boxes=[atas.concat([{l:'AMBILAN',v:fRp(c.a3)},{l:'JUMLAH DITERIMA',v:fRp(terima),b:1}])]}
  else{const gaji=first?c.gMin:c.gMun,amb=first?c.a1:c.a2;terima=gaji-amb;boxes=[atas,[{l:'GAJI',v:fRp(gaji)},{l:'AMBILAN',v:fRp(amb)},{l:'JUMLAH DITERIMA',v:fRp(terima),b:1}]]}
  const bln=BLNF[d.getMonth()];
  return{kandang:K,periode:P,nama:nama.toUpperCase(),tanggal:d.getDate()+' '+bln+' '+d.getFullYear(),kota:'LHOKSEUMAWE',tglKota:d.getDate()+' '+bln.toUpperCase()+' '+d.getFullYear(),boxes,terbilang:terbilang(terima),
    warn:c.pend>0?'':'Pendapatan belum diisi. Isi dulu lewat tombol Input pendapatan.',
    file:'Slip-'+nama.replace(/ /g,'-')+'-Kandang-'+K+'-Periode-'+P+'.pdf'};
}
function buildSlip(S){
  const W=595,H=842,M=42,R=W-M,pg=newPage(W,H);
  pg.IM(1,M,30,88,88);
  pg.T(M+102,82,'PT PERFECTO MITRA INDUSTRI','F2',17);
  pg.TC(W/2,146,'USAHA KANDANG AYAM','F2',15);
  pg.LN(M,157,R,157,1.4);
  pg.T(M,182,'KANDANG PMI '+S.kandang,'F2',11);pg.TR(R,182,'PERIODE = '+S.periode,'F2',11);
  pg.T(M,202,'Tanggal : '+S.tanggal,'F1',11);pg.TR(R,202,'NAMA : '+S.nama,'F2',11);
  let y=222;
  const box=rows=>{
    const rh=26,h=rows.length*rh;
    rows.forEach((r,i)=>{if(r.b)pg.FR(M,y+i*rh,R-M,rh,0.93)});
    pg.RC(M,y,R-M,h,1);pg.LN(360,y,360,y+h,0.6);
    rows.forEach((r,i)=>{
      const yy=y+i*rh,f=r.b?'F2':'F1';
      if(i>0)pg.LN(M,yy,R,yy,0.6);
      pg.T(M+10,yy+17,r.l,f,11);pg.TR(R-10,yy+17,r.v,f,11);
    });
    y+=h;
  };
  S.boxes.forEach((b,i)=>{if(i>0)y+=30;box(b)});
  // terbilang
  y+=28;pg.T(M,y,'TERBILANG :','F2',11);
  const mx=R-M-86,words=S.terbilang.split(' '),lines=[];let cur='';
  words.forEach(w=>{if(tw((cur+' '+w).trim(),'F3',11)>mx){lines.push(cur);cur=w}else cur=(cur+' '+w).trim()});
  if(cur)lines.push(cur);
  lines.forEach((l,i)=>pg.T(M+86,y+i*15,l,'F3',11));
  y+=(lines.length-1)*15;
  // tanda tangan
  const ys=y+54,cxL=M+78,cxR=432;
  pg.TC(cxL,ys,'PENERIMA','F2',11);
  pg.TC(cxL,ys+16+40,'('+S.nama+')','F2',11);
  pg.TC(cxR,ys,S.kota+', '+S.tglKota,'F2',11);
  pg.TC(cxR,ys+16,'HORMAT KAMI','F2',11);
  pg.IM(2,cxR-100,ys+24,200,Math.round(200*IMG_STAMP.h/IMG_STAMP.w));
  pg.TC(cxR,ys+24+Math.round(200*IMG_STAMP.h/IMG_STAMP.w)+16,'PT PERFECTO MITRA INDUSTRI','F2',10);
  return pdfAssemble([pg.ops],[IMG_LOGO,IMG_STAMP]);
}
function slipHtml(S){
  const li='data:image/jpeg;base64,'+IMG_LOGO.b,si='data:image/jpeg;base64,'+IMG_STAMP.b;
  const tb=b=>`<table class="slt">${b.map(r=>`<tr${r.b?' class="sb"':''}><td>${esc(r.l)}</td><td class="n">${esc(r.v)}</td></tr>`).join('')}</table>`;
  return (S.warn?`<p class="note warn">${esc(S.warn)}</p>`:'')+
   `<div class="slh"><img src="${li}" alt=""><b>PT PERFECTO MITRA INDUSTRI</b></div><div class="slj">USAHA KANDANG AYAM</div>
    <div class="slr"><b>KANDANG PMI ${S.kandang}</b><b>PERIODE = ${S.periode}</b></div>
    <div class="slr"><span>Tanggal : ${esc(S.tanggal)}</span><b>NAMA : ${esc(S.nama)}</b></div>
    ${S.boxes.map(tb).join('<div class="slg"></div>')}
    <div class="slb"><b>TERBILANG :</b> <i>${esc(S.terbilang)}</i></div>
    <div class="slsg"><div><b>PENERIMA</b><div class="slnm">(${esc(S.nama)})</div></div>
    <div class="slc"><b>${esc(S.kota)}, ${esc(S.tglKota)}</b><b>HORMAT KAMI</b><img src="${si}" alt=""><b>PT PERFECTO MITRA INDUSTRI</b></div></div>`;
}
function renderSlip(){$('#slBody').innerHTML=slipHtml(hitungSlip($('#slNama').value))}
function bukaSlip(){
  const sel=$('#slNama'),prev=sel.value,ls=daftarKaryawan();
  sel.innerHTML=ls.map(n=>`<option>${n}</option>`).join('');
  if(ls.includes(prev))sel.value=prev;
  $('#slMsg').textContent='';renderSlip();$('#slv').hidden=false;
}
async function kirimSlip(forceDl){
  const S=hitungSlip($('#slNama').value),blob=new Blob([buildSlip(S)],{type:'application/pdf'});
  const say=t=>{const e=$('#slMsg');if(e)e.textContent=t};
  try{await saveFile(blob,S.file,'Kirim slip gaji',forceDl);say(forceDl?'PDF disimpan: '+S.file:'Pilih WhatsApp di menu bagikan.')}
  catch(e){if(e&&e.name==='AbortError')return;say('Gagal membuat PDF: '+(e&&e.message?e.message:'coba lagi'))}
}
function render(){
  $('#ctx').textContent='Kandang '+K+' · Periode '+P;
  beranda();laporan();rekap();bagihasil();
}
$('#selK').onchange=e=>{K=+e.target.value;P=0;fillP();saveLast();render();subscribe()};
$('#selP').onchange=e=>{P=+e.target.value;saveLast();render();subscribe()};
function showTab(T,keep){
  TAB=T;
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.t===T));
  document.querySelectorAll('.sec').forEach(x=>x.classList.toggle('on',x.id==='t-'+T));
  if(!keep)scrollTo(0,0);
  saveLast();
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>showTab(b.dataset.t));
$('#selK').value=String(K);
fillP();render();showTab(TAB,true);initCloud();
</script>
