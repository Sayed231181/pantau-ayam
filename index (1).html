*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}

.sub{color:var(--mut);font-size:13px}

main{padding:14px 16px;max-width:760px;margin:0 auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px}
.card .k{font-size:12px;color:var(--mut)}
.card .v{font-size:22px;font-weight:700;margin-top:2px;word-break:break-word}
.card .h{font-size:11.5px;color:var(--mut);margin-top:4px}
.card.in{padding-bottom:11px}
.card.in input{margin-top:6px}
.acc{background:var(--acc2);border-color:transparent}
.acc .v{color:var(--acc)}
.warn{color:var(--warn)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--acc2);color:var(--acc);margin-left:6px;vertical-align:middle}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:460px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;color:var(--mut);font-weight:600;position:sticky;top:0;background:var(--card)}
td.n,th.n{text-align:right}
tfoot td{font-weight:700;border-bottom:0}
.empty{padding:28px 12px;text-align:center;color:var(--mut)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:9px 4px 8px;font:inherit;font-size:12px;min-height:52px}
nav button b{display:block;font-size:19px;line-height:1.1}
nav button.on{color:var(--acc);font-weight:700}
.sec{display:none}.sec.on{display:block}
p.note{font-size:12px;color:var(--mut);margin:12px 2px 0}
</style>

const $=s=>document.querySelector(s);
const rp=n=>n==null?'—':(n<0?'−':'')+'Rp '+Math.abs(Math.round(n)).toLocaleString('id-ID');
const nf=(n,d=0)=>n==null?'—':Number(n).toLocaleString('id-ID',{minimumFractionDigits:d,maximumFractionDigits:d});
const BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const tgl=s=>{if(!s)return '';const m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(s);return m?(+m[3])+' '+BLN[+m[2]-1]+' '+m[1]:s};
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

let K=1,P=0,TAB='beranda';
const MAXP={1:30,2:25};
const periods=k=>Array.from({length:MAXP[k]},(_,i)=>i+1);
const hasData=(k,p)=>!!(D.lap[k+'-'+p]||D.rek[k+'-'+p]);
const latest=k=>{const ps=periods(k).filter(p=>hasData(k,p));return ps.length?ps[ps.length-1]:1};
const key=()=>K+'-'+P;
const ST='pantau-ayam:';
function load(){try{return JSON.parse(localStorage.getItem(ST+key())||'{}')}catch(e){return{}}}
function save(o){try{localStorage.setItem(ST+key(),JSON.stringify(o))}catch(e){}}
function saldoRek(){
  const l=D.lap[key()];
  if(K===1)return l&&l.saldo!=null?{v:l.saldo,via:null}:null;
  for(const[k1,v]of Object.entries(D.lap)){if(v.pair===key()&&v.saldo!=null)return{v:v.saldo,via:k1.split('-')[1]}}
  return null;
}
function fillP(){
  const ps=periods(K);if(!P||!ps.includes(P))P=latest(K);
  $('#selP').innerHTML=ps.map(p=>`<option value="${p}"${p===P?' selected':''}>Periode ${p}${hasData(K,p)?'':' (kosong)'}</option>`).join('');
}
function umurInfo(m,h){
  if(!m)return{v:'—',h:'Isi tanggal masuk ayam'};
  const a=new Date(m+'T00:00:00');const t=new Date();const end=h?new Date(h+'T00:00:00'):new Date(t.getFullYear(),t.getMonth(),t.getDate());
  const d=Math.round((end-a)/864e5);
  if(d<0)return{v:'—',h:'Tanggal habis panen lebih awal dari tanggal masuk',w:1};
  return{v:d+' hari',h:h?'Dihitung sampai tanggal habis panen':'Dihitung sampai hari ini'};
}
function beranda(){
  const r=D.rek[key()],s=saldoRek(),m=load();
  const rows=r?r.rows:[];const ds=rows.map(x=>x[0]).filter(x=>/^\d{4}-/.test(x||'')).sort();
  const u=umurInfo(m.masuk,m.habis);
  const sh=s?(s.via?`Rekening bersama, dari sheet Kdg 1 periode ${s.via}`:'Dari sheet Kdg 1'):'Belum ada data saldo rek untuk periode ini';
  $('#t-beranda').innerHTML=`<div class="grid">
   <div class="card acc"><div class="k">Saldo rek</div><div class="v">${rp(s&&s.v)}</div><div class="h">${sh}</div></div>
   <div class="card"><div class="k">Jumlah ekor panen</div><div class="v">${r?nf(r.ekor):'—'}</div><div class="h">${r?'Sisa ayam: '+nf(r.sisa):'Belum ada rekap panen'}</div></div>
   <div class="card in"><div class="k">Tanggal masuk ayam</div><input type="date" id="dM" value="${m.masuk||''}"><div class="h">Isi manual</div></div>
   <div class="card in"><div class="k">Tanggal habis panen</div><input type="date" id="dH" value="${m.habis||''}"><div class="h">${ds.length?'Rekap: '+tgl(ds[0])+' – '+tgl(ds[ds.length-1]):'Isi manual'}</div></div>
   <div class="card"><div class="k">Umur ayam</div><div class="v${u.w?' warn':''}" id="uV">${u.v}</div><div class="h" id="uH">${u.h}</div></div>
   <div class="card"><div class="k">Berat total ayam</div><div class="v">${r?nf(r.berat,1)+' kg':'—'}</div><div class="h">${r&&r.ekor?'Rata-rata '+nf(r.berat/r.ekor,2)+' kg/ekor':''}</div></div>
  </div>
  <p class="note">Tanggal yang Anda isi tersimpan di perangkat ini untuk tiap kandang dan periode.</p>`;
  const upd=()=>{const o={masuk:$('#dM').value,habis:$('#dH').value};save(o);const x=umurInfo(o.masuk,o.habis);$('#uV').textContent=x.v;$('#uV').className='v'+(x.w?' warn':'');$('#uH').textContent=x.h};
  $('#dM').onchange=upd;$('#dH').onchange=upd;
}
function laporan(){
  const l=D.lap[key()],s=saldoRek();
  if(!l){$('#t-laporan').innerHTML='<div class="empty">Belum ada laporan untuk kandang dan periode ini.</div>';return}
  $('#t-laporan').innerHTML=`<div class="grid">
   <div class="card"><div class="k">Total kredit</div><div class="v">${rp(l.kredit)}</div></div>
   <div class="card"><div class="k">Total debit</div><div class="v">${rp(l.debit)}</div></div>
   ${s?`<div class="card acc" style="grid-column:1/-1"><div class="k">Saldo rek</div><div class="v">${rp(s.v)}</div></div>`:''}
  </div>
  <div class="wrap"><table><thead><tr><th>Tanggal</th><th>Transaksi</th><th class="n">Kredit</th><th class="n">Debit</th><th>Ket.</th></tr></thead><tbody>
  ${l.rows.map(x=>`<tr><td>${esc(tgl(x[0]))}</td><td>${esc(x[1])}</td><td class="n">${x[2]?nf(x[2]):''}</td><td class="n">${x[3]?nf(x[3]):''}</td><td>${esc(x[4])}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Belum ada transaksi.</td></tr>'}
  </tbody><tfoot><tr><td colspan="2">Total</td><td class="n">${nf(l.kredit)}</td><td class="n">${nf(l.debit)}</td><td></td></tr></tfoot></table></div>`;
}
function rekap(){
  const r=D.rek[key()];
  if(!r||!r.rows.length){$('#t-rekap').innerHTML='<div class="empty">Belum ada rekap panen untuk kandang dan periode ini.</div>';return}
  $('#t-rekap').innerHTML=`<div class="grid">
   <div class="card"><div class="k">Jumlah ekor panen</div><div class="v">${nf(r.ekor)}</div></div>
   <div class="card"><div class="k">Berat total</div><div class="v">${nf(r.berat,1)} kg</div></div>
   <div class="card"><div class="k">Berat rata-rata</div><div class="v">${r.ekor?nf(r.berat/r.ekor,2):'—'} kg</div></div>
   <div class="card"><div class="k">Sisa ayam</div><div class="v">${nf(r.sisa)}</div></div>
  </div>
  <div class="wrap"><table><thead><tr><th>Tanggal</th><th class="n">Umur</th><th class="n">Ekor</th><th class="n">Berat (kg)</th><th>Penangkap</th><th>Plat</th></tr></thead><tbody>
  ${r.rows.map(x=>`<tr><td>${esc(tgl(x[0]))}</td><td class="n">${x[1]??''}</td><td class="n">${nf(x[2])}</td><td class="n">${nf(x[3],1)}</td><td>${esc(x[4])}</td><td>${esc(x[5])}</td></tr>`).join('')}
  </tbody><tfoot><tr><td colspan="2">Total</td><td class="n">${nf(r.ekor)}</td><td class="n">${nf(r.berat,1)}</td><td colspan="2"></td></tr></tfoot></table></div>`;
}
function render(){
  $('#ctx').textContent='Kandang '+K+' · Periode '+P;
  beranda();laporan();rekap();
}
$('#selK').onchange=e=>{K=+e.target.value;P=0;fillP();render()};
$('#selP').onchange=e=>{P=+e.target.value;render()};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  TAB=b.dataset.t;
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.sec').forEach(x=>x.classList.toggle('on',x.id==='t-'+TAB));
  scrollTo(0,0);
});
fillP();render();
</script>
</body>
